<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=430, initial-scale=1" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <style>
      * { box-sizing: border-box; margin: 0; }
      body { width: 430px; height: 932px; font-family: Inter, sans-serif; background: #152238; color: #152238; overflow: hidden; }
      .wrap { padding: 56px 28px 40px; }
      .card { background: #fff; border-radius: 24px; padding: 28px 24px 32px; box-shadow: 0 20px 40px rgba(0,0,0,.25); }
      img { display: block; height: 96px; margin: 0 auto 12px; }
      p.sub { text-align: center; color: #64748b; font-size: 14px; margin-bottom: 22px; }
      label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
      input { width: 100%; border: 1px solid #d7dee8; border-radius: 14px; padding: 14px; font-size: 16px; margin-bottom: 14px; }
      .btn { width: 100%; background: #152238; color: #fff; border: 0; border-radius: 14px; padding: 16px; font-size: 16px; font-weight: 700; }
      .gold { margin-top: 14px; width: 100%; background: #fff; color: #152238; border: 3px solid #c9a227; border-radius: 14px; padding: 14px; font-weight: 700; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <img src="logo.png" alt="EDB Total" />
        <p class="sub">Entre com o acesso da sua igreja</p>
        <label>Usuário</label>
        <input value="sua.igreja" readonly />
        <label>Senha</label>
        <input type="password" value="••••••••" readonly />
        <button class="btn">Entrar</button>
        <button class="gold">Esqueci a senha</button>
      </div>
    </div>
  </body>
</html>
